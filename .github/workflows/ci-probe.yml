# Throwaway probe for #63's spec: the whole suite, file by file, on a hosted runner. Never merged.
name: ci-probe
on:
  push:
    branches: [ci-probe/63]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
      - name: let bwrap make user namespaces, and give the sandbox a Nix /usr/bin/env
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mount --bind "$(nix build --no-link --print-out-paths nixpkgs#coreutils)/bin/env" /usr/bin/env
      - name: every test file, own process, own deadline
        env:
          NIXI_DOCS_ALL: "1"
        run: |
          time nix develop -c nix shell nixpkgs#chromium nixpkgs#nodejs nixpkgs#ffmpeg -c \
            python3 -B .github/ci/run_tests.py --allow /dev/null
