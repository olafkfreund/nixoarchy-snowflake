# Throwaway probe for #63's spec: the whole suite, file by file, on a hosted runner. Never merged.
name: ci-probe
on:
  push:
    branches: [ci-probe/63]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
      - name: let bwrap make user namespaces, and give the sandbox a Nix /usr/bin/env
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mount --bind "$(nix build --no-link --print-out-paths nixpkgs#coreutils)/bin/env" /usr/bin/env
      - name: halo case only, bounds to 2 decimals, and the fonts in use
        run: |
          nix develop -c nix shell nixpkgs#chromium nixpkgs#nodejs nixpkgs#fontconfig -c sh -c '
            fc-match sans-serif; fc-match serif; fc-match monospace; fc-list | wc -l
            cd tests && python3 -B -m unittest -v test_character_fit.CharacterFit.test_plugin_character' 2>&1 | tail -60
