# Throwaway probe for #63's spec: can a hosted runner run bwrap + pasta and headless Chromium from Nix? Never merged.
name: ci-probe
on:
  push:
    branches: [ci-probe/63]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31.3.0
      - name: kernel and userns facts
        run: |
          uname -r; cat /etc/os-release | head -2
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sysctl kernel.unprivileged_userns_clone || true
      - name: sandbox tests as-is (expected to show the userns limit)
        continue-on-error: true
        run: time nix develop -c timeout 600 python3 -B tests/test_plugin_sandbox.py
      - name: relax the AppArmor userns restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: sandbox tests after relaxing
        continue-on-error: true
        run: time nix develop -c timeout 600 python3 -B tests/test_plugin_sandbox.py
      - name: one fit test with Nix chromium and node
        continue-on-error: true
        run: time nix shell nixpkgs#chromium nixpkgs#nodejs nixpkgs#python3 -c timeout 600 python3 -B tests/test_notify_fit.py
      - name: nix build cold cost
        continue-on-error: true
        run: time nix build --no-link -L .#default 2>&1 | tail -3; df -h / | tail -1
